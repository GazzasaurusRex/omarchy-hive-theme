focus-border-alpha = 1.0
selected-color = "#f7f9fa"
selected-fill-alpha = 0.16
selected-border = "#b5121b"
selected-border-width = 1
selected-border-alpha = 1.0
pressed-fill-alpha = 0.22
selection-fill-alpha = 0.32

[spacing]
scale = 0.94
