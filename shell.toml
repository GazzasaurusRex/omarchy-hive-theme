[bar]
background = "#07090b"
background-alpha = 0.98
text = "#d8dde1"
active = "#d51f2b"
scale-with-font = true
size-horizontal = 27
size-vertical = 29

[hyprland]
active-border = "rgba(b5121bee) rgba(641018dd) 90deg"
